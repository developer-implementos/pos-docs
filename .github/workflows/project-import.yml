name: Project import
# Opens or updates the PR that imports the POS Platform delivery snapshots (progress, follow-ups,
# planning and questions) from a clean checkout of its main branch. A person reviews and merges it.
# The import App key lives in the `project-import` environment, which only admits `main`, and the
# hourly run stays off until the PROJECT_IMPORT_ENABLED variable is `true`; see tools/project-import/README.md.
# The `alert` job keeps one issue open while the import fails and closes it when a run succeeds.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [pos-platform-delivery-changed]
permissions:
  contents: read
jobs:
  import:
    name: Import project snapshots
    if: github.event_name == 'workflow_dispatch' || vars.PROJECT_IMPORT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: project-import
    concurrency:
      group: project-import
      cancel-in-progress: false
    steps:
      # Full history: the progress importer reads, with `git show`, the roadmap revision that
      # delivery/progress.json pins, an older commit of this repository.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: pos-docs
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Issue a read-only token for POS Platform
        id: product
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.IMPORT_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMPORT_APP_PRIVATE_KEY }}
          owner: developer-implementos
          repositories: pos-platform
          permission-contents: read
          permission-issues: read
      - name: Check out POS Platform main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: developer-implementos/pos-platform
          path: pos-platform
          token: ${{ steps.product.outputs.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Issue a token to open the import PR in POS Docs
        id: docs
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.IMPORT_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMPORT_APP_PRIVATE_KEY }}
          owner: developer-implementos
          repositories: pos-docs
          permission-contents: write
          permission-pull-requests: write
      - name: Import the snapshots and open or update the PR
        working-directory: pos-docs
        env:
          GH_TOKEN: ${{ steps.product.outputs.token }}
          POS_DOCS_TOKEN: ${{ steps.docs.outputs.token }}
          IMPORT_APP_SLUG: ${{ steps.docs.outputs.app-slug }}
        run: node tools/project-import/run.mjs --workspace ../pos-platform --publish
  alert:
    name: Alert on a failing import
    # A scheduled run that fails is read by nobody (TASK-386). Opens or reminds one labelled issue
    # while the import fails and closes it when a run succeeds; see tools/project-import/alert.mjs.
    # `always()` runs it after a failed or cancelled import; a skipped import (opt-in schedule) does not.
    needs: import
    if: always() && needs.import.result != 'skipped' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Two runs that fail together would both see no open issue and open two.
    concurrency:
      group: project-import-alert
      cancel-in-progress: false
    # The only write permission in this workflow's default token, and only on issues. No environment,
    # no App key and nothing from the product: the step reads the result of the job above.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Open, remind or close the import alert
        env:
          GH_TOKEN: ${{ github.token }}
          IMPORT_RESULT: ${{ needs.import.result }}
        run: node tools/project-import/alert.mjs
