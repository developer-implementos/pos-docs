name: Project import
# Opens or updates the PR that imports the POS Platform delivery snapshots (progress, follow-ups,
# planning and questions) from a clean checkout of its main branch. A person reviews and merges it.
# The import App key lives in the `project-import` environment, which only admits `main`, and the
# hourly run stays off until the PROJECT_IMPORT_ENABLED variable is `true`; see tools/project-import/README.md.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [pos-platform-delivery-changed]
permissions:
  contents: read
jobs:
  import:
    name: Import project snapshots
    if: github.event_name == 'workflow_dispatch' || vars.PROJECT_IMPORT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: project-import
    concurrency:
      group: project-import
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: pos-docs
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Issue a read-only token for POS Platform
        id: product
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.IMPORT_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMPORT_APP_PRIVATE_KEY }}
          owner: developer-implementos
          repositories: pos-platform
          permission-contents: read
          permission-issues: read
      - name: Check out POS Platform main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: developer-implementos/pos-platform
          path: pos-platform
          token: ${{ steps.product.outputs.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Issue a token to open the import PR in POS Docs
        id: docs
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.IMPORT_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMPORT_APP_PRIVATE_KEY }}
          owner: developer-implementos
          repositories: pos-docs
          permission-contents: write
          permission-pull-requests: write
      - name: Import the snapshots and open or update the PR
        working-directory: pos-docs
        env:
          GH_TOKEN: ${{ steps.product.outputs.token }}
          POS_DOCS_TOKEN: ${{ steps.docs.outputs.token }}
          IMPORT_APP_SLUG: ${{ steps.docs.outputs.app-slug }}
        run: node tools/project-import/run.mjs --workspace ../pos-platform --publish
