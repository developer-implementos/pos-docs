name: Documentation quality
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: apps/starlight/package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm run setup
      - run: npm --prefix apps/starlight exec playwright install --with-deps chromium
      - name: Run the canonical local and CI verification
        run: npm run verify
      - name: Check declared reader journeys in generated HTML
        if: github.event_name == 'pull_request'
        run: node tools/editorial/journeys-check.mjs --event-file "$GITHUB_EVENT_PATH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: documentation-check
          path: |
            test-results-docs/
            test-results-architecture/
            test-results-presentations/
            test-results-portal/
            test-results-follow-up/
            test-results-project/
            test-results-roadmap/
            test-results-viewer/
            test-results-reference/
            test-results-archify/
          if-no-files-found: ignore
          retention-days: 14
