name: Release
# Opens or updates the release PR and tags it once merged. The release App token lives in the
# `release` environment, which only admits `main`; see tools/release/README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    concurrency:
      group: release-please
      cancel-in-progress: false
    steps:
      - name: Record when this run started
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Issue a release App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Fail if a merged release is still untagged
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          STARTED_AT: ${{ steps.start.outputs.at }}
        run: node tools/release/verify.mjs --started-at "$STARTED_AT"
      - name: Summarize the published version
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          URL: ${{ steps.release.outputs.html_url }}
        run: echo "- Publicada la versión $TAG: $URL" >> "$GITHUB_STEP_SUMMARY"
