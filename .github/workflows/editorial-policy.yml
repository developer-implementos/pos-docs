name: Editorial PR policy
on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: editorial-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  editorial-policy:
    # Pool confiable cuando exista (POS_CI_TRUSTED_RUNS_ON); mientras tanto el pool
    # propio, por la misma decision que pos-platform#161 tomo para su PR policy:
    # solo herramientas del SHA base, token de lectura y sin secretos, que
    # tools/editorial/policy.test.mjs afirma.
    runs-on: ${{ fromJSON(vars.POS_CI_TRUSTED_RUNS_ON || vars.POS_CI_LINUX_RUNS_ON || '["self-hosted","linux","x64"]') }}
    timeout-minutes: 5
    steps:
      # Execute only the policy from the trusted base. Never checkout PR code,
      # download PR artifacts, restore caches or install packages in this job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Validate declarations and available issue evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/editorial/pr-check.mjs --event-file "$GITHUB_EVENT_PATH" --github
